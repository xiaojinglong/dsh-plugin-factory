name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install (reproducible)
        run: npm ci --ignore-scripts
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Package factory
        run: npm run factory:package
      - name: Upload factory package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-factory-${{ runner.os }}
          path: release/*.zip*
          if-no-files-found: error
