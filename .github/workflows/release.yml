name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run release:package -- --out dist
      - run: node scripts/verify-release.cjs --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-factory-release
          path: dist/
          if-no-files-found: error
